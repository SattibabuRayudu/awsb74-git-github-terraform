name: Terraform Deployment Pipeline For AWS Batch 74
on:
  # pull_request:
  #   types:
  #   - closed
  #   branches:
  #     - production
  #   paths-ignore:
  #     - 'ReadMe.md'
  push:
    branches: 
    - production
    - development
    paths-ignore:
    - 'ReadMe.md'

#We need to add Production under push because GitHub Actions consider PR merges as push events to the target branch.
#GitHub Actions workflows on the destination branch (e.g., main) trigger automatically 
#on push events from PR merges, as the merge commit counts as a push to that branch. 
#To force a specific workflow on the destination branch when a PR targeting it is closed/merged, 
#combine pull_request with closed triggers and conditions checking the base branch.

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ vars.AWS_REGION}}
  ENV_DESTROY_DEV: "NO"
  ENV_DESTROY_PROD: "NO"
  TERRAFORM_DESTROY: ${{ vars.TERRAFORM_DESTROY}}
  TERRAFORM_VERSION: "1.15.8"


jobs: #Jobs List
  terraform-checkov:
    if: ${{ vars.TERRAFORM_DESTROY == 'NO' }}
    name: 'Stage_1 - Checkov Security Scanning For Terraform Code'
    runs-on: ubuntu-latest #Default Runner Provided By GitHub.
    defaults:
      run:
        working-directory: ./Alpha-Bravo
    steps:
      - name: Checkout The Code Repository
        uses: actions/checkout@v6
      - name: Print Runner Hostname
        run: echo $HOSTNAME
      - name: Setup Checkov For Security Scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./Alpha-Bravo
          quiet: true
          soft_fail: false #If false, the action will fail if any checks fail.
          output_format: cli,json
          output_file_path: console,./Alpha-Bravo/results.json
      - name: Upload Checkov Results to S3 Bucket
        uses: koraykoska/s3-upload-github-action@master
        env:
          FILE: ./Alpha-Bravo/results.json
          S3_ENDPOINT: 's3.us-east-1.amazonaws.com'
          S3_BUCKET: "rayudu-terraform-modules"
          S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}